name: model_badge
version: 1.1.0
manifest_version: 2
api_version: 1
description: "Telegram reply footer: provider logo (custom emoji), model name, thinking effort and a context-usage bar."
author: Nikita Wolf
license: MIT
homepage: https://github.com/wwwolf21/hermes-plugin-model-badge
kind: standalone
tags: [gateway, telegram, model, context, badge]
provides_hooks:
  - pre_api_request
  - post_api_request
  - transform_llm_output
config_schema:
  platforms:
    type: list
    default: ["telegram"]
    description: "Gateway platforms that get the footer (MarkdownV2 custom emoji only renders on Telegram)."
  badges:
    type: list
    default: []
    description: "Extra/override rows: [{match: '<regex on lowercase model id>', emoji_id: '<custom_emoji_id>', fallback: '🤖'}]. Checked before the built-ins; first match wins."
  show_thinking:
    type: bool
    default: true
    description: "Show the reasoning effort that went out on the wire (🧠H/M/L, 🧠A = model decides, 🚫 = off)."
  show_context:
    type: bool
    default: true
    description: "Show the context bar: prompt tokens of the last API call vs the model's context window."
  bar_width:
    type: int
    default: 5
    description: "Segments in the context bar."
  preset:
    type: str
    default: quote
    description: "Look: quote (blockquote + mono), line (plain text), mono, spoiler (tap to reveal), minimal (model · effort · %), logo (logo only), bar (logo + bar), full (adds raw model id)."
  layout:
    type: str
    default: ""
    description: "Override the preset wrapper: line | quote | spoiler."
  mono:
    type: bool
    default: false
    description: "Override: wrap the text part in a monospace span (the logo always stays outside)."
  template:
    type: str
    default: ""
    description: "Override the preset template. Fields: {logo} {model} {raw_model} {thinking} {bar} {pct} {used} {ctx} {sep}. Empty fields and their separators collapse."
  separator:
    type: str
    default: " · "
    description: "Text substituted for {sep}."
  model_name:
    type: str
    default: pretty
    description: "pretty (Claude Fable 5.1) or raw (claude-fable-5-1)."
  thinking_style:
    type: str
    default: letter
    description: "letter (🧠H), word (🧠 high) or icon (🧠 only, no level)."
  thinking_icon:
    type: str
    default: "🧠"
    description: "Icon when thinking is on."
  thinking_off:
    type: str
    default: "🚫"
    description: "Marker when thinking is off."
